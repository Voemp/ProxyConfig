# Rules
rules:
  # 1. 广告
  - GEOSITE,category-ads-all,REJECT
  # 2. 进程
  - PROCESS-NAME,NeteaseMusic,直连
  - PROCESS-NAME,prl_naptd,手动选择
  - PROCESS-NAME,prl_disp_service,手动选择
  - PROCESS-NAME,com.parallels.naptd,手动选择
  # 3. 私有 / 局域网
  - GEOSITE,private,直连
  - GEOIP,private,直连,no-resolve
  - RULE-SET,Lan,直连,no-resolve
  # 4. 自定义分流
  - DOMAIN-SUFFIX,codelife.cc,直连
  - DOMAIN-SUFFIX,imacso.com,直连
  - DOMAIN-SUFFIX,linux.do,手动选择
  - RULE-SET,DirectRule,DIRECT
  - RULE-SET,EmbyRule,Emby
  # 5. 国内 AI
  - DOMAIN-SUFFIX,doubao.com,直连
  - DOMAIN-SUFFIX,deepseek.com,直连
  - DOMAIN-SUFFIX,muyuan.do,直连
  - DOMAIN-SUFFIX,new.sharedchat.cc,香港
  - DOMAIN-SUFFIX,icoe.pp.ua,香港
  - DOMAIN-SUFFIX,ai.hybgzs.com,直连
  - DOMAIN-SUFFIX,cdk.hybgzs.com,直连
  # 6. 国外 AI
  - RULE-SET,OpenAI,OpenAI
  - RULE-SET,Claude,Claude
  - RULE-SET,Gemini,Gemini
  - DOMAIN-SUFFIX,grok.com,手动选择
  - DOMAIN-SUFFIX,x.ai,手动选择
  # 7. Apple
  - DOMAIN-SUFFIX,apple.com.cn,直连
  - DOMAIN-SUFFIX,icloud.com.cn,直连
  - RULE-SET,Apple,自动选择
  # 8. 国外服务
  - RULE-SET,Google,Google
  - DOMAIN-SUFFIX,googleapis.com,Google
  - DOMAIN-SUFFIX,gstatic.com,Google
  - DOMAIN-SUFFIX,ggpht.com,Google
  - RULE-SET,Github,Github
  - RULE-SET,Steam,Steam
  - RULE-SET,Emby,Emby
  # 9. 国际媒体
  - DOMAIN-SUFFIX,ytimg.com,国际媒体
  - DOMAIN-SUFFIX,googlevideo.com,国际媒体
  - RULE-SET,GlobalMedia,国际媒体
  # 10. Microsoft
