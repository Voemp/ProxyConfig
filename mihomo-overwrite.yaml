# ============================================================

# 通用配置
mode: rule
ipv6: true
mixed-port: 7890
allow-lan: true
bind-address: 0.0.0.0
log-level: info
unified-delay: true
find-process-mode: strict
global-client-fingerprint: chrome
profile:
  store-selected: true
  store-fake-ip: true
tcp-concurrent: true
keep-alive-interval: 15
keep-alive-idle: 15
disable-keep-alive: true

# DNS
dns:
  enable: true
  ipv6: true
  prefer-h3: false
  use-hosts: false
  use-system-hosts: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    # 本地域名
    - "+.lan"
    - "+.local"
    - "+.localhost"
    - "localhost"
    # Windows 网络检测
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    # NTP
    - "time.windows.com"
    - "time.apple.com"
    - "time.asia.apple.com"
    - "time1.aliyun.com"
    - "time2.aliyun.com"
    - "ntp.aliyun.com"
    - "ntp1.aliyun.com"
    - "ntp.ntsc.ac.cn"
    - "cn.ntp.org.cn"
    - "pool.ntp.org"
    - "+.pool.ntp.org"
    # STUN
    - "+.stun.*.*"
    - "+.stun.*.*.*"
    - "stun.l.google.com"
    - "stun1.l.google.com"
    # 腾讯
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "localhost.work.weixin.qq.com"
    - "+.qq.com"
    - "+.weixin.qq.com"
    - "+.wechat.com"
    - "+.tencent.com"
    # 小米
    - "+.xiaomi.com"
    - "+.mi.com"
    - "+.miui.com"
    - "+.xiaomi.net"
    - "+.mi.net"
    - "+.miui.net"
    - "market.xiaomi.com"
    # Apple 中国
    - "+.apple.com.cn"
    - "+.icloud.com.cn"
    # 国内常用服务
    - "+.bilibili.com"
    - "+.bilivideo.com"
    - "+.hdslb.com"
    - "+.163.com"
    - "+.126.net"
    - "+.netease.com"
    - "+.baidu.com"
    - "+.bdstatic.com"
    - "+.taobao.com"
    - "+.tmall.com"
    - "+.alipay.com"
    - "+.aliyun.com"
    - "+.alibaba.com"
    - "+.jd.com"
    - "+.360.cn"
    - "+.qihu.com"
    - "+.weibo.com"
    - "+.sinaimg.cn"
    - "+.iqiyi.com"
    - "+.youku.com"
    - "+.mgtv.com"
    - "+.douyin.com"
    - "+.toutiao.com"
    - "+.bytedance.com"
    - "+.kuaishou.com"
    # 国内 DNS
    - "doh.pub"
    - "dns.alidns.com"
    - "dot.pub"
    - "223.5.5.5"
    - "119.29.29.29"
    - "+.pcbeta.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    "geosite:cn,private":
      - https://1.12.12.12/dns-query
      - https://223.5.5.5/dns-query
    "geosite:geolocation-!cn":
      - "https://1.1.1.1/dns-query#手动选择"
      - "https://8.8.8.8/dns-query#手动选择"
  nameserver:
    - "https://1.1.1.1/dns-query#手动选择"
    - "https://8.8.8.8/dns-query#手动选择"
  proxy-server-nameserver:
    - https://1.12.12.12/dns-query
    - https://223.5.5.5/dns-query
  direct-nameserver:
    - https://1.12.12.12/dns-query
    - https://223.5.5.5/dns-query

# ==================== GEO ====================
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geodata-loader: memconservative
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
  asn: "https://github.com/xishang0128/geoip/releases/download/latest/GeoLite2-ASN.mmdb"

# NTP
ntp:
  enable: true
  write-to-system: false
  server: ntp1.aliyun.com
  port: 123
  interval: 30

# TUN
tun:
  enable: true
  stack: system
  auto-route: true
  strict-route: false
  auto-detect-interface: true
  dns-hijack:
    - any:53

# 嗅探
sniffer:
  enable: false
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    TLS:
      ports:
        - 443
        - 8443
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    QUIC:
      ports:
        - 443
        - 8443
  force-domain: []
  skip-domain:
    - +.oray.com
    - "Mijia Cloud"
    - "+.push.apple.com"

# 面板
external-controller: 127.0.0.1:9090
secret: ""
external-ui: "./ui"
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 代理组锚点
SelectALL: &SelectALL
  type: select
  proxies:
    - 自动选择
    - 香港
    - 台湾
    - 日本
    - 英国
    - 美国
    - 狮城
    - 其他
    - DIRECT
    - REJECT
  include-all: true

SelectHK: &SelectHK
  type: select
  proxies:
    - 香港
    - 自动选择
    - 台湾
    - 日本
    - 英国
    - 美国
    - 狮城
    - 其他
    - DIRECT
    - REJECT

SelectTW: &SelectTW
  type: select
  proxies:
    - 台湾
    - 手动选择
    - 香港
    - 日本
    - 英国
    - 美国
    - 狮城
    - 其他
    - DIRECT
    - REJECT

SelectUS: &SelectUS
  type: url-test
  interval: 300
  tolerance: 50
  url: "https://www.gstatic.com/generate_204"
  include-all: true
  filter: "🇺|美国|美|US|united states|america|los angeles|san jose|silicon valley"

SelectMedia: &SelectMedia
  type: select
  proxies:
    - 节流
    - 手动选择
    - DIRECT
    - REJECT

SelectDirect: &SelectDirect
  type: select
  proxies:
    - DIRECT
    - 手动选择
    - 香港
    - 台湾
    - 日本
    - 英国
    - 美国
    - 狮城
    - 其他
    - REJECT

SelectProxy: &SelectProxy
  type: select
  proxies:
    - 手动选择
    - 香港
    - 台湾
    - 日本
    - 英国
    - 美国
    - 狮城
    - 其他
    - DIRECT
    - REJECT

UrlTest: &UrlTest
  type: url-test
  interval: 300
  tolerance: 50
  url: "https://www.gstatic.com/generate_204"
  hidden: true
  include-all: true
  disable-udp: false

Fallback: &Fallback
  type: fallback
  interval: 300
  tolerance: 50
  url: "https://www.gstatic.com/generate_204"
  hidden: true
  include-all: true
  disable-udp: false

# 代理组
proxy-groups:
  - name: 手动选择
    <<: *SelectALL
    include-all: true
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Rocket.png
  - name: OpenAI
    <<: *SelectProxy
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png
  - name: Claude
    <<: *SelectProxy
    icon: https://testingcf.jsdelivr.net/gh/Voemp/ProxyConfig@main/icon/Claude.png
  - name: Gemini
    <<: *SelectProxy
    icon: https://testingcf.jsdelivr.net/gh/guaishouxiaoqi/icons@master/Color/Gemini.png
  - name: Google
    <<: *SelectProxy
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png
  - name: 国际媒体
    <<: *SelectMedia
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Streaming.png
  - name: Emby
    <<: *SelectMedia
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Emby.png
  - name: Steam
    <<: *SelectProxy
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Steam.png
  - name: Github
    <<: *SelectProxy
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/GitHub.png
  - name: Microsoft
    <<: *SelectDirect
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Microsoft.png
  - name: Apple
    <<: *SelectDirect
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple.png
  - name: Telegram
    <<: *SelectProxy
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png
  - name: Twitter
    <<: *SelectProxy
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Twitter.png
  - name: 漏网之鱼
    <<: *SelectProxy
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png
  - name: GLOBAL
    <<: *SelectProxy
    include-all: true
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png
  - name: 直连
    <<: *SelectDirect
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png
  - name: 自动选择
    <<: *SelectUS
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
  - name: 香港
    <<: *UrlTest
    filter: "🇭🇰|香港|港|HK|hongkong|hong kong"
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hong_Kong.png
  - name: 台湾
    <<: *UrlTest
    filter: "🇹🇼|台湾|台|TW|taiwan|taipei"
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Taiwan.png
  - name: 日本
    <<: *UrlTest
    filter: "🇯🇵|日本|JP|japan|tokyo|osaka"
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Japan.png
  - name: 英国
    <<: *UrlTest
    filter: "🇬🇧|英国|英|UK|united kingdom|london"
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_Kingdom.png
  - name: 美国
    <<: *UrlTest
    filter: "🇺🇸|美国|美|US|united states|america|los angeles|san jose|silicon valley"
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/United_States.png
  - name: 狮城
    <<: *UrlTest
    filter: "🇸🇬|新加坡|新|狮城|SG|singapore"
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Singapore.png
  - name: 其他
    <<: *UrlTest
    filter: "(?i)^(?!.*(香港|台湾|日本|新加坡|狮城|英国|美国|港|台|日|新|英|美|hk|tw|jp|sg|uk|us)).*"
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png
  - name: 节流
    <<: *UrlTest
    filter: "自建|流媒体|0.1x"
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Speedtest.png

# 规则 Provider
rule-anchor:
  DomainYaml: &DomainYaml
    behavior: domain
    interval: 86400
    proxy: 手动选择
    type: http
  ClassicalYaml: &ClassicalYaml
    behavior: classical
    interval: 86400
    proxy: 手动选择
    type: http

rule-providers:
