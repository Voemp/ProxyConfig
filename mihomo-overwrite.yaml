  EmbyRule:
    <<: *ClassicalYaml
    url: https://ghfast.top/https://raw.githubusercontent.com/Voemp/ProxyConfig/main/rule/EmbyRule.yaml
  cn_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.mrs"
